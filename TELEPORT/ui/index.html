<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELEPORT ELEVATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* UI ist standardmäßig versteckt */
        body {
            display: none !important;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        body.show {
            display: flex !important;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="panel-wrapper">
        <div class="main-panel">
            <!-- Header -->
            <div class="header">
                <div class="header-icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 10V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/>
                        <path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>
                    </svg>
                </div>
                <div class="header-titles">
                    <h1 id="elevatorTitle">ELEVATOR</h1>
                    <p id="elevatorLabel">KORTZ ESTATE</p>
                </div>
                <div class="header-action">
                    <!-- Optional close or config icon to match the reference style -->
                </div>
            </div>

            <!-- Floor Display -->
            <div class="section-container">
                <div class="section-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                    <span id="floorLabel">CURRENT FLOOR</span>
                </div>
                
                <div class="floor-display-box">
                    <div class="floor-info">
                        <span class="floor-number" id="floorNumber">01</span>
                        <span class="floor-label" id="floorName">House</span>
                    </div>
                    
                    <div class="direction-indicator">
                        <svg class="direction-arrow" id="arrowUp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m18 15-6-6-6 6"/>
                        </svg>
                        <svg class="direction-arrow" id="arrowDown" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </div>
                </div>
                
                <div class="progress-bar" id="progressBar" style="display: none;">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Floor Buttons Container -->
            <div class="section-container">
                <div class="section-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3v18H3V3h18z"/><path d="M21 9H3"/><path d="M21 15H3"/></svg>
                    <span>SELECT FLOOR</span>
                </div>
                <div class="floor-buttons" id="floorButtonsContainer">
                    <!-- Buttons werden dynamisch aus der Config geladen -->
                </div>
            </div>

            <!-- Passcode Input -->
            <div class="section-container" id="passcodeContainer">
                <div class="section-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span>PASSCODE</span>
                </div>
                <div class="passcode-input-wrapper">
                    <input type="password" id="passcodeInput" placeholder="Enter code (if required)" class="passcode-input" autocomplete="off" />
                </div>
            </div>
        </div>
    </div>
        <!-- Admin Tablet Panel -->
    <div class="admin-wrapper" id="adminPanel" style="display: none;">
        <div class="ox-container">
            <div class="ox-sidebar">
                <div class="ox-logo">
                    <div class="ox-logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    </div>
                    <div class="ox-logo-text">
                        <h2>TELEPORT</h2>
                        <p>SETTINGS</p>
                    </div>
                </div>
                <div class="ox-nav" id="adminElevatorList">
                    <!-- Elevators go here -->
                </div>
                <div class="ox-sidebar-footer">
                    <div class="ox-version">
                        <div class="ox-version-icon">i</div>
                        <div class="ox-version-text">
                            <strong>v1.0.0</strong>
                            <span>by TELEPORT</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="ox-main">
                <div class="ox-header">
                    <div class="ox-header-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        <span id="editElevatorTitle">GENERAL SETTINGS</span>
                    </div>
                    <div class="ox-header-actions">
                        <button class="ox-btn-secondary" id="adminAddElevatorBtn" style="gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Configuration</button>
                        <button class="ox-btn-icon" id="adminCloseBtn">✕</button>
                    </div>
                </div>
                
                <div class="ox-content" id="adminEditor" style="display: none;">
                    
                    <div class="ox-section">
                        <div class="ox-section-header">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                            <span>ELEVATOR INFO</span>
                        </div>
                        <div class="ox-section-body">
                            <div class="ox-form-row">
                                <div class="ox-form-group">
                                    <label>ELEVATOR ID</label>
                                    <input type="text" id="editElevatorId" />
                                </div>
                                <div class="ox-form-group">
                                    <label>ELEVATOR LABEL</label>
                                    <input type="text" id="editElevatorLabel" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="ox-section">
                        <div class="ox-section-header">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 3v18H3V3h18z"/><path d="M21 9H3"/><path d="M21 15H3"/></svg>
                            <span>FLOORS</span>
                        </div>
                        <div class="ox-section-body" style="padding: 12px; display: flex; flex-direction: column; gap: 8px;">
                            <div id="adminFloorsList" class="ox-floors-list">
                                <!-- Floors generated here -->
                            </div>
                            <button class="ox-btn-outline" id="adminAddFloorBtn" style="width: 100%;">+ Add Floor</button>
                        </div>
                    </div>

                </div>
                
                <div class="ox-footer">
                    <button class="ox-btn-danger" id="adminDeleteElevatorBtn">Delete Elevator</button>
                    <button class="ox-btn-primary" id="adminSaveBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Save Settings
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
